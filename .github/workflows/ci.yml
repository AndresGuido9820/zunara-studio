name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.18'
      - run: uv sync --locked --extra youtube --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync bandit -c pyproject.toml -r src -q
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - name: Smoke test built wheel outside the checkout
        run: |
          uv venv /tmp/zunara-wheel-test
          uv pip install --python /tmp/zunara-wheel-test/bin/python dist/*.whl
          cd /tmp
          /tmp/zunara-wheel-test/bin/zunara --version
          /tmp/zunara-wheel-test/bin/zunara doctor

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.18'
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - run: uv sync --locked --extra youtube --group dev
      - run: uv run --no-sync pytest --cov=zunara --cov-report=term-missing

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.18'
      - run: uv sync --locked --group dev
      - name: Audit locked runtime and development dependencies
        run: |
          uv export --locked --all-extras --group dev --no-emit-project --format requirements-txt --output-file /tmp/zunara-requirements.txt
          uv run --no-sync pip-audit --requirement /tmp/zunara-requirements.txt --no-deps --disable-pip

  workflow-security:
    name: Workflows and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/check-workflows-and-secrets.sh
