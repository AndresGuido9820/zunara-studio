[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zunara-studio"
version = "0.1.0"
description = "Local-first tools to find, render, review and publish short video clips."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Zunara Studio contributors"}]
dependencies = ["filelock>=3.18", "platformdirs>=4.3", "numpy>=2.0", "soundfile>=0.13", "requests>=2.32.4"]

[project.optional-dependencies]
downloads = ["yt-dlp>=2025.3.31"]
youtube = ["google-api-python-client>=2.160", "google-auth-oauthlib>=1.2"]
analysis = ["librosa>=0.11", "scipy>=1.15"]
asr = ["onnx-asr[cpu]>=0.8", "huggingface-hub>=0.30.2"]
browser = ["playwright>=1.55"]

[project.scripts]
zunara = "zunara.cli:main"

[project.urls]
Repository = "https://github.com/AndresGuido9820/zunara-studio"
Issues = "https://github.com/AndresGuido9820/zunara-studio/issues"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "bandit[toml]>=1.8", "pip-audit>=2.9", "build>=1.2", "twine>=6", "types-requests>=2.32"]

[tool.hatch.build.targets.wheel]
packages = ["src/zunara"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra --strict-markers"
markers = ["integration: exercises local external tools, never platform APIs", "contract: adapter tests with fake remote clients", "browser: drives local Chromium against fixture pages; never a real platform"]

[tool.coverage.run]
source = ["zunara"]
omit = ["*/audio_match.py", "*/rank_moments.py", "*/fetch_vod.py"]

[tool.mypy]
python_version = "3.11"
files = ["src/zunara/config.py", "src/zunara/storage.py", "src/zunara/media.py", "src/zunara/queue.py", "src/zunara/youtube.py", "src/zunara/cli.py", "src/zunara/editorial.py", "src/zunara/social.py", "src/zunara/instagram.py", "src/zunara/browser.py", "src/zunara/browser_bridge.py"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# Subprocesses run vetted executables with argument lists (never shell=True).
# B603/B607 are reviewed at each call site, not blanket-disabled here.
